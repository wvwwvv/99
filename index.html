:root{
  --ink:#181818;--paper:#f2f2f2;--chip:#cccccc;--ibg:#f2f2f2;--ifg:#181818;
  --font:"Diodrum Arabic",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --w:min(100vw,820px);--u:calc(var(--w) / 1080);
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-aspect-ratio:1/1){:root{--w:min(100vw,max(560px,62vh))}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ibg:#181818;--ifg:#f2f2f2}}
:root[data-theme="dark"]{--ibg:#181818;--ifg:#f2f2f2}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink);-webkit-text-size-adjust:100%}
html.intro-on{overflow:hidden}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font);-webkit-font-smoothing:antialiased}

/* ---------- intro (original animation) ---------- */
#intro{position:fixed;inset:0;z-index:100;background:var(--ibg);display:flex;align-items:center;justify-content:center;transition:opacity .8s ease;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#intro svg{width:min(92vw,900px);height:auto;fill:var(--ifg);overflow:visible}
#intro svg *{transform-box:fill-box}
#intro .pop,.hl.play .pop{transform:scale(0);transform-origin:center;animation:pop .8s cubic-bezier(.34,1.56,.64,1) forwards}
#intro .a-c,.hl.play .a-c{animation-delay:.1s}#intro .b-c,.hl.play .b-c{animation-delay:.35s}
@keyframes pop{to{transform:scale(1)}}
#intro .grow,.hl.play .grow{transform:scaleY(0);animation:grow .55s cubic-bezier(.2,.8,.2,1) forwards}
#intro .a-s,.hl.play .a-s{transform-origin:top;animation-delay:.6s}
#intro .b-s,.hl.play .b-s{transform-origin:bottom;animation-delay:.85s}
@keyframes grow{to{transform:scaleY(1)}}
#intro .tm,.hl.play .tm{opacity:0;transform:scale(.2) rotate(-180deg);transform-origin:center;animation:tm .7s cubic-bezier(.34,1.56,.64,1) 1.2s forwards}
@keyframes tm{to{opacity:1;transform:none}}
#intro .l,.hl.play .l{opacity:0;transform:translateY(24px);animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
#intro .l:nth-of-type(1),.hl.play .l:nth-of-type(1){animation-delay:1.3s}
#intro .l:nth-of-type(2),.hl.play .l:nth-of-type(2){animation-delay:1.4s}
#intro .l:nth-of-type(3),.hl.play .l:nth-of-type(3){animation-delay:1.5s}
#intro .l:nth-of-type(4),.hl.play .l:nth-of-type(4){animation-delay:1.6s}
#intro .l:nth-of-type(5),.hl.play .l:nth-of-type(5){animation-delay:1.7s}
#intro .l:nth-of-type(6),.hl.play .l:nth-of-type(6){animation-delay:1.8s}
@keyframes rise{to{opacity:1;transform:none}}
.breathe{transform-origin:center;animation:breathe 4s ease-in-out 2.6s infinite}
@keyframes breathe{50%{transform:scale(1.015)}}

/* ---------- page (designed on a 1080-wide artboard; 1u = 1/1080 of the column) ---------- */
.page{position:relative;width:var(--w);margin:0 auto}
.stage{position:relative;height:calc(1920*var(--u));overflow:visible}
.more{height:max(60svh,420px)}
.abs{position:absolute}

.cap{position:absolute;z-index:5;left:0;top:0;width:100%;height:calc(441*var(--u));background:var(--paper);
  border-radius:0 0 calc(150*var(--u)) calc(150*var(--u));
  transform-origin:50% 0;transition:transform .7s cubic-bezier(.7,0,.2,1),opacity .45s ease .1s}
.cap.is-away{transform:translateY(-101%);opacity:0;pointer-events:none}
.capin{position:relative;width:var(--w);height:100%;margin:0 auto}
.hl *{transform-box:fill-box}
.hl:not(.play) .pop,.hl:not(.play) .grow,.hl:not(.play) .tm,.hl:not(.play) .l{opacity:0}
.capin svg{position:absolute;left:calc(99*var(--u));top:calc(185*var(--u));width:calc(479*var(--u));height:calc(136*var(--u));fill:var(--ink);overflow:visible}

.tag{position:absolute;left:0;width:100%;top:calc(507*var(--u));margin:0;text-align:center;font-weight:700;font-size:calc(56.6*var(--u));line-height:1.1;white-space:nowrap}

.tag span{display:inline-block;white-space:pre;opacity:0}
.tag.play span{animation:rise .5s cubic-bezier(.2,.8,.2,1) calc(var(--i)*.045s) forwards}
.navslot{position:absolute;left:calc(82*var(--u));top:calc(583*var(--u));width:calc(941*var(--u));height:calc(103*var(--u));pointer-events:none}
.nav{position:fixed;z-index:50;top:0;left:50%;width:calc(941*var(--u));margin-left:calc(-0.5*var(--w) + 82*var(--u));height:calc(103*var(--u));
  box-sizing:border-box;padding:0 calc(32*var(--u));display:flex;align-items:center;gap:calc(14*var(--u));
  background:var(--paper);border-radius:999px;will-change:transform;transition:box-shadow .5s ease,background-color .5s ease}
.nav.moving{transition:transform .65s cubic-bezier(.3,1.2,.4,1),box-shadow .5s ease,background-color .5s ease}

  <button type="button" data-go="top">HOME</button>
  <button type="button">ABOUT US</button>

<script>
(function(){
  var root=document.documentElement,intro=document.getElementById('intro');
  var cap=document.getElementById('cap'),nav=document.getElementById('nav'),slot=document.getElementById('slot'),safe=document.getElementById('safe');
  var away=false,gap=14,mt,ticking=false;

  var hl=cap.querySelector('.hl'),tag=document.getElementById('tag');
  var txt=tag.textContent;tag.innerHTML=txt.split('').map(function(c,i){return '<span aria-hidden="true" style="--i:'+i+'">'+c+'</span>'}).join('');
  function playLogo(){hl.classList.remove('play');void hl.getBoundingClientRect();hl.classList.add('play')}
  function playTag(){tag.classList.add('play')}
  /* intro -> home */
  var done=false;
  function endIntro(){
    if(done)return;done=true;
    intro.classList.add('out');
    setTimeout(playLogo,350);setTimeout(playTag,350+2500);
    setTimeout(function(){root.classList.remove('intro-on');intro.remove();update()},850);
  }
  setTimeout(endIntro,3500);
  intro.addEventListener('click',endIntro);

  /* cap + nav on scroll */
  function measure(){gap=safe.offsetHeight+14}
  function setAway(v){
    away=v;cap.classList.toggle('is-away',v);var tc=document.querySelector('meta[name=theme-color]');if(tc)tc.setAttribute('content',v?'#181818':'#f2f2f2');nav.classList.toggle('is-floating',v);
    nav.classList.add('moving');clearTimeout(mt);mt=setTimeout(function(){nav.classList.remove('moving')},750);
  }
  function update(){
    ticking=false;
    var y=window.pageYOffset||0;
    if(!away&&y>40)setAway(true);else if(away&&y<10){setAway(false);if(done)setTimeout(playLogo,300)}
    var ty=away?gap:slot.getBoundingClientRect().top;
    nav.style.transform='translate3d(0,'+ty+'px,0)';
  }
  function req(){if(!ticking){ticking=true;requestAnimationFrame(update)}}
  window.addEventListener('scroll',req,{passive:true});
  window.addEventListener('resize',function(){measure();req()});
  measure();update();

  nav.firstElementChild.classList.add('is-active');nav.firstElementChild.setAttribute('aria-current','true');
  /* glass press on nav buttons */
  function glass(b){b.classList.add('glass');clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('glass')},700)}
  nav.addEventListener('pointerdown',function(e){var b=e.target.closest('button');if(b)glass(b)});
  nav.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;glass(b);
    nav.querySelectorAll('button').forEach(function(x){var on=x===b;x.classList.toggle('is-active',on);if(on)x.setAttribute('aria-current','true');else x.removeAttribute('aria-current')});
    if(b.dataset.go==='top')window.scrollTo({top:0,behavior:'smooth'});
  });
})();
</script>
