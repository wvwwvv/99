:root{
  --ink:#181818;--paper:#f2f2f2;--chip:#cccccc;--ibg:#181818;--ifg:#f2f2f2;
  --font:"Diodrum Arabic",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --w:min(100vw,820px);--u:calc(var(--w) / 1080);
  --ib:40px;--top:calc(env(safe-area-inset-top,0px) + 6px);--navtop:calc(var(--top) + var(--ib) + 6px);
  --edge:calc(14px + env(safe-area-inset-left,0px));--edger:calc(14px + env(safe-area-inset-right,0px));
  --navl:82;--navw:941;
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-aspect-ratio:1/1){:root{--w:min(100vw,clamp(560px,74vh,780px))}}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  :root{--ib:52px;--top:32px;--navtop:var(--top);--edge:clamp(20px,3vw,56px);--edger:clamp(20px,3vw,56px);--navl:-60;--navw:1200}
  .nav{padding:0 calc(112*var(--u))}
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink);-webkit-text-size-adjust:100%}
html.intro-on{overflow:hidden}
body{position:relative;margin:0;background:var(--ink);color:var(--paper);font-family:var(--font);-webkit-font-smoothing:antialiased}

/* ---------- intro (original animation) ---------- */
#intro{position:fixed;inset:0;z-index:100;background:var(--ibg);display:flex;align-items:center;justify-content:center;transition:opacity .6s ease;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#intro svg{width:clamp(250px,72vw,540px);height:auto;fill:var(--ifg);overflow:visible}
#intro svg *{transform-box:fill-box}
#intro .pop,.hl.play .pop{transform:scale(0);transform-origin:center;animation:pop .8s cubic-bezier(.34,1.56,.64,1) forwards}
#intro .a-c,.hl.play .a-c{animation-delay:.1s}#intro .b-c,.hl.play .b-c{animation-delay:.35s}
@keyframes pop{to{transform:scale(1)}}
#intro .grow,.hl.play .grow{transform:scaleY(0);animation:grow .55s cubic-bezier(.2,.8,.2,1) forwards}
#intro .a-s,.hl.play .a-s{transform-origin:top;animation-delay:.6s}
#intro .b-s,.hl.play .b-s{transform-origin:bottom;animation-delay:.85s}
@keyframes grow{to{transform:scaleY(1)}}
#intro .tm,.hl.play .tm{opacity:0;transform:scale(.2) rotate(-180deg);transform-origin:center;animation:tm .7s cubic-bezier(.34,1.56,.64,1) 1.2s forwards}
@keyframes tm{to{opacity:1;transform:none}}
#intro .l,.hl.play .l{opacity:0;transform:translateY(24px);animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
#intro .l:nth-of-type(1),.hl.play .l:nth-of-type(1){animation-delay:1.3s}
#intro .l:nth-of-type(2),.hl.play .l:nth-of-type(2){animation-delay:1.4s}
#intro .l:nth-of-type(3),.hl.play .l:nth-of-type(3){animation-delay:1.5s}
#intro .l:nth-of-type(4),.hl.play .l:nth-of-type(4){animation-delay:1.6s}
#intro .l:nth-of-type(5),.hl.play .l:nth-of-type(5){animation-delay:1.7s}
#intro .l:nth-of-type(6),.hl.play .l:nth-of-type(6){animation-delay:1.8s}
@keyframes rise{to{opacity:1;transform:none}}
.breathe{transform-origin:center;animation:breathe 4s ease-in-out 2.6s infinite}
@keyframes breathe{50%{transform:scale(1.015)}}

/* ---------- page (designed on a 1080-wide artboard; 1u = 1/1080 of the column) ---------- */
.page{position:relative;width:var(--w);margin:0 auto}
.stage{position:relative;height:calc(1920*var(--u));overflow:visible}
.more{height:max(60svh,420px)}

.cap{position:absolute;z-index:5;left:0;top:0;width:100%;height:calc(441*var(--u));background:var(--paper);
  border-radius:0 0 calc(150*var(--u)) calc(150*var(--u));will-change:opacity}
.capin{position:relative;width:var(--w);height:100%;margin:0 auto}
.hl *{transform-box:fill-box}
.hl:not(.play) .pop,.hl:not(.play) .grow,.hl:not(.play) .tm,.hl:not(.play) .l{opacity:0}
.capin svg{position:absolute;left:calc(99*var(--u));top:calc(185*var(--u));width:calc(479*var(--u));height:calc(136*var(--u));fill:var(--ink);overflow:visible}

/* tagline: centred between the white piece and the icon bar, static */
.tag{position:absolute;left:0;width:100%;top:calc(484*var(--u));margin:0;text-align:center;font-weight:700;font-size:calc(56.6*var(--u));line-height:1.1;white-space:nowrap}

/* icon bar: sticky = scroll-smooth, no JS positioning */
.navwrap{position:absolute;z-index:50;left:calc(var(--navl)*var(--u));width:calc(var(--navw)*var(--u));top:calc(583*var(--u));bottom:0;pointer-events:none}
.nav{position:-webkit-sticky;position:sticky;top:var(--navtop);pointer-events:auto;width:100%;height:calc(103*var(--u));
  box-sizing:border-box;padding:0 calc(32*var(--u));display:flex;align-items:center;gap:calc(14*var(--u));
  background:var(--paper);border-radius:999px;transition:box-shadow .4s ease}
.nav.is-floating{box-shadow:0 10px 30px rgba(0,0,0,.45)}
.nav button{position:relative;overflow:hidden;appearance:none;border:1px solid transparent;margin:0;height:calc(71*var(--u));min-width:0;padding:0;
  border-radius:calc(30*var(--u));background:var(--chip);color:var(--ink);font:700 calc(32.9*var(--u))/1 var(--font);cursor:pointer;
  transition:transform .35s cubic-bezier(.3,1.4,.5,1),background .45s ease,box-shadow .45s ease,border-color .45s ease,opacity .2s ease;
  -webkit-tap-highlight-color:transparent}
.nav button:nth-child(1){flex:177 1 0}.nav button:nth-child(2){flex:215 1 0}.nav button:nth-child(3){flex:294 1 0}.nav button:nth-child(4){flex:178 1 0}
.nav button::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transform:translateX(-60%);
  background:linear-gradient(105deg,transparent 30%,rgba(24,24,24,.12) 50%,transparent 70%);transition:opacity .3s ease}
.nav button.glass,.nav button.is-active{transform:scale(1.05);border-color:var(--paper);
  background:linear-gradient(135deg,var(--paper),rgba(242,242,242,.8) 60%,var(--paper));
  -webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:blur(10px) saturate(180%);
  box-shadow:inset 0 1px 1px rgba(242,242,242,1),inset 0 -2px 5px rgba(24,24,24,.14),0 8px 20px rgba(24,24,24,.3)}
.nav button.is-active:not(.glass){transform:none}
.nav button.glass::after{opacity:1;transform:translateX(60%);transition:transform .7s ease,opacity .3s ease}
.nav button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.fade{opacity:0!important}
.tag,.role{transition:opacity .2s ease}

/* corner icons (appear once the white piece is gone) */
.ci{position:relative;pointer-events:auto;flex:none;width:var(--ib);height:var(--ib);margin:0;padding:0;border-radius:50%;
  border:1px solid rgba(255,255,255,.34);color:var(--paper);display:none;place-items:center;cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,255,255,.07) 55%,rgba(255,255,255,.16));
  -webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.08);backdrop-filter:blur(18px) saturate(190%) brightness(1.08);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.65),inset 0 -1.5px 2px rgba(255,255,255,.18),inset 0 0 14px rgba(255,255,255,.08),0 8px 26px rgba(0,0,0,.38);
  -webkit-tap-highlight-color:transparent;isolation:isolate;overflow:hidden;
  transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .3s ease,opacity .25s ease,visibility .25s}
.ci::before{content:"";position:absolute;left:12%;right:12%;top:5%;height:42%;border-radius:50%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}
.ci svg{position:relative}
.rail{display:block;position:fixed;z-index:60;left:0;right:0;top:var(--top);height:var(--ib);pointer-events:none}
.rail-row{position:relative;height:var(--ib);display:flex;align-items:center;justify-content:space-between;padding:0 var(--edger) 0 var(--edge);pointer-events:none}
.ci{display:grid}
@media (min-width:900px){
  .rail{display:block;position:absolute;z-index:60;left:0;right:0;top:calc(583*var(--u));bottom:0;height:auto;pointer-events:none}
  .rail-row{position:sticky;top:var(--navtop);height:calc(103*var(--u));display:flex;align-items:center;justify-content:space-between;padding:0 var(--edger) 0 var(--edge);pointer-events:none}
  .ci{display:grid}
}
.ci svg{display:block}
.ci-logo svg{width:68%;height:auto;fill:currentColor}
.ci-lang svg{width:54%;height:auto}
.ci:active{transform:scale(.92)!important}
@media (hover:hover){.ci:hover{transform:scale(1.08)}}
.ci:active{background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.14))}
.ci:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

/* photo + name + big logo = one group */
.group{position:absolute;inset:0;pointer-events:none}
.hero{position:absolute;z-index:1;margin:0;left:calc(104*var(--u));top:calc(695*var(--u));width:calc(849*var(--u));height:calc(837*var(--u));pointer-events:auto}
.hero img{display:block;width:100%;height:100%;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){.hero:hover img{transform:scale(1.045)}}

.name{position:absolute;z-index:2;left:calc(149*var(--u));top:calc(1215*var(--u));margin:0;font-weight:700;font-size:calc(44*var(--u));line-height:1}
.role{position:absolute;z-index:2;left:calc(148*var(--u));top:calc(1262*var(--u));margin:0;font-weight:300;font-size:calc(30.2*var(--u));line-height:1;white-space:nowrap}
.big{position:absolute;z-index:3;left:calc(80*var(--u));top:calc(1333*var(--u));width:calc(908*var(--u));height:auto;overflow:visible}
.sheen{animation:sheen 4.6s cubic-bezier(.45,0,.25,1) 1s infinite}
@keyframes sheen{0%{transform:translateX(40px)}42%,100%{transform:translateX(680px)}}

/* PC: header logo on the left, whole group on the right */
@media (min-width:900px) and (min-aspect-ratio:1/1){
  .capin{width:100%}
  .capin svg{left:clamp(56px,7.5vw,144px);top:50%;width:clamp(300px,23vw,440px);height:auto;aspect-ratio:887/253.5;transform:translateY(-50%)}
  .group{transform-origin:calc(988*var(--u)) calc(695*var(--u));transform:translate(calc(95vw - (100vw - var(--w)) / 2 - 988*var(--u) - 3.4vw),calc(72*var(--u))) scale(.76)}
}
@media (prefers-reduced-motion:reduce){
  .hl *,#intro *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .sheen{animation:none;opacity:0}
  .nav button,.hero img,.ci{transition-duration:.01s!important}
  .hero:hover img{transform:none}
}
</style>

<script>
(function(){
  var root=document.documentElement,intro=document.getElementById('intro');
  var cap=document.getElementById('cap'),nav=document.getElementById('nav');
  var homeBtn=document.getElementById('homeBtn'),langBtn=document.getElementById('langBtn');
  var tag=document.getElementById('tag'),role=document.getElementById('role');
  var btns=Array.prototype.slice.call(nav.querySelectorAll('button'));
  var hl=cap.querySelector('.hl'),icons=[homeBtn,langBtn],mqD=window.matchMedia('(min-width:900px) and (min-aspect-ratio:1/1)');
  var dk=false,floating=false,ticking=false,R=1,stickTop=0,done=false;

  function playLogo(){hl.classList.remove('play');void hl.getBoundingClientRect();hl.classList.add('play')}

  /* intro -> home, right after the logo has finished writing itself */
  function endIntro(){
    if(done)return;done=true;
    intro.classList.add('out');
    var tc=document.querySelector('meta[name=theme-color]');if(tc)tc.setAttribute('content','#f2f2f2');
    setTimeout(playLogo,250);
    setTimeout(function(){root.classList.remove('intro-on');intro.remove();measure();update()},650);
  }
  setTimeout(endIntro,2500);
  intro.addEventListener('click',endIntro);

  /* scroll: white piece fades gradually, corner icons fade in, nav is sticky (CSS) */
  function measure(){
    R=Math.max(1,cap.offsetHeight*.8);
    stickTop=parseFloat(getComputedStyle(nav).top)||0;
  }
  function update(){
    ticking=false;
    var y=Math.max(0,window.pageYOffset||0);
    var p=Math.min(1,y/R);
    cap.style.opacity=(1-p).toFixed(3);tag.style.opacity=p>=.98?'0':(1-p).toFixed(3);
    cap.style.pointerEvents=p>.9?'none':'';
    var q=Math.max(0,Math.min(1,(p-.5)/.5));
    for(var i=0;i<icons.length;i++){
      var e=icons[i].style;
      if(mqD.matches){e.opacity='';e.visibility='';}
      else{var on=p>=.98;e.opacity=on?'1':'0';e.visibility=on?'visible':'hidden';}
    }
    var fl=nav.getBoundingClientRect().top<=stickTop+.5;
    if(fl!==floating){floating=fl;nav.classList.toggle('is-floating',fl)}
    var d=p>.5;if(d!==dk){dk=d;var tc=document.querySelector('meta[name=theme-color]');if(tc&&done)tc.setAttribute('content',d?'#181818':'#f2f2f2')}
  }
  function req(){if(!ticking){ticking=true;requestAnimationFrame(update)}}
  window.addEventListener('scroll',req,{passive:true});
  window.addEventListener('resize',function(){measure();req()});
  measure();update();

  /* nav: persistent white active item + glass press */
  function setActive(b){
    btns.forEach(function(x){var on=x===b;x.classList.toggle('is-active',on);if(on)x.setAttribute('aria-current','true');else x.removeAttribute('aria-current')});
  }
  setActive(btns[0]);
  function glass(b){b.classList.add('glass');clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('glass')},700)}
  nav.addEventListener('pointerdown',function(e){var b=e.target.closest('button');if(b)glass(b)});
  nav.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;glass(b);setActive(b);
    if(b.dataset.go==='top')window.scrollTo({top:0,behavior:'smooth'});
  });

  /* logo icon: refresh when on Home, otherwise go back to Home */
  homeBtn.addEventListener('click',function(){
    if(btns[0].classList.contains('is-active')){location.reload();}
    else{setActive(btns[0]);window.scrollTo({top:0,behavior:'smooth'})}
  });

  /* language toggle EN <-> AR */
  var T={
    en:{dir:'ltr',tag:'99% DESIGN . 1% NORMAL',nav:['HOME','SERVICES','PORTFOLIO','CONTACT'],role:'Graphic Designer',label:'Switch to Arabic'},
    ar:{dir:'rtl',tag:'99% تصميم . 1% عادي',nav:['الرئيسية','خدماتنا','أعمالنا','تواصل'],role:'مصمم جرافيك',label:'التبديل إلى الإنجليزية'}
  };
  var lang='en';
  function paint(l){
    var t=T[l];lang=l;
    root.lang=l;root.dir=t.dir;
    tag.textContent=t.tag;role.textContent=t.role;
    btns.forEach(function(b,i){b.textContent=t.nav[i]});
    langBtn.setAttribute('aria-label',t.label);
  }
  function setLang(l,animate){
    if(!animate){paint(l);return}
    var els=[tag,role].concat(btns);
    els.forEach(function(e){e.classList.add('fade')});
    setTimeout(function(){paint(l);els.forEach(function(e){e.classList.remove('fade')})},200);
  }
  try{var sv=localStorage.getItem('ab-lang');if(sv&&T[sv]&&true)paint(sv)}catch(e){}
  langBtn.addEventListener('click',function(){
    var n=lang==='en'?'ar':'en';setLang(n,true);
    try{localStorage.setItem('ab-lang',n)}catch(e){}
  });
})();
</script>
